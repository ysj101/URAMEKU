<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ウラメク 素材一覧</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f5f0e6;color:#242322}header{background:#242322;color:#fff;padding:28px}h1{margin:0;font-size:2rem}nav a{margin-right:16px;color:#ffd7d4}main{max-width:1260px;margin:auto;padding:24px}section{margin:25px 0}h2{border-bottom:5px double #242322}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}.tile{border:2px solid #242322;background:#fffaf0;padding:12px;min-width:0}.tile img{width:100%;height:180px;object-fit:contain}.tile label{display:block;font-size:.7rem;word-break:break-all}img{background:repeating-conic-gradient(#e9e2d6 0 25%,#fffaf0 0 50%) 50%/24px 24px}</style></head><body><header><h1>ウラメク / Asset catalog</h1><p>実ファイルだけを表示。人物のリアクションは固定原画＋記号合成。</p><nav><a href="../prototype/">ゲーム試作</a><a href="../docs/ASSET_INVENTORY.md">資産台帳</a></nav></header><main id="root"></main><script>
const areas={brand:['brand/wordmark-dark.png','brand/ogp-1200x630.png','brand/app-icon-512.png'],characters:[],cases:[],ui:['ui/frames/evidence-pin.png','ui/frames/newspaper.png','ui/stamps/verified.png','ui/states/clear.png'],backgrounds:['backgrounds/scene-office.png','backgrounds/scene-caseboard.png','backgrounds/scene-archive.png'],encyclopedia:[]};
for(const c of ['shinobu','mega','kuro','harada'])for(const m of ['idle','happy','surprised','thinking','worried'])areas.characters.push(`characters/${c}/reactions/${m}.png`);
for(let i=1;i<=5;i++)areas.cases.push(`cases/case-0${i}/cover.png`);
for(const c of ['framing','anchoring','social-proof','sunk-cost','graph-scale'])areas.encyclopedia.push(`encyclopedia/${c}.png`);
const root=document.querySelector('#root');for(const [area,items] of Object.entries(areas)){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=area;section.append(h);const grid=document.createElement('div');grid.className='grid';for(const path of items){const tile=document.createElement('div');tile.className='tile';const img=new Image();img.src=`../public/assets/${path}`;img.loading='lazy';img.alt=path;const l=document.createElement('label');l.textContent=path;tile.append(img,l);grid.append(tile);}section.append(grid);root.append(section)}
</script></body></html>
