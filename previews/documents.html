<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ウラメク 調査資料サムネイル一覧</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f5f0e6;color:#242322}header{background:#242322;color:#fff;padding:28px}h1{margin:0;font-size:2rem}header p{max-width:70ch}nav a{margin-right:16px;color:#ffd7d4}main{max-width:1260px;margin:auto;padding:24px}section{margin:25px 0}h2{border-bottom:5px double #242322}h2 small{font-weight:400;font-size:.8rem;margin-left:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}.tile{border:2px solid #242322;background:#fffaf0;padding:12px;min-width:0}.tile img.thumb{width:100%;height:180px;object-fit:contain}.tile label{display:block;font-size:.7rem;word-break:break-all;color:#746f68;margin-top:6px}.tile strong{display:block;font-size:.85rem;margin-top:6px}img{background:repeating-conic-gradient(#e9e2d6 0 25%,#fffaf0 0 50%) 50%/24px 24px}.doclabel{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:4px 8px;border:1px solid #aaa192;border-radius:2px;background:#e8dabd;font-size:.7rem;line-height:1.4;margin-top:8px;max-width:100%}.doclabel img{width:1.6em;height:1.6em;background:none}.doclabel .case{font-family:Georgia,serif;font-weight:700;color:#cf4b4b}.doclabel .num{font-weight:700}.doclabel .kind{padding:0 4px;border:1px solid #242322;border-radius:2px;background:#fffaf0}.doclabel .cost{color:#487d93;font-weight:700}.doclabel .sep{color:#8f8b83}.controls{margin:12px 0;font-size:.85rem}.controls label{margin-right:16px}body.hide-labels .doclabel{display:none}body.small .tile img.thumb{height:78px}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem}.legend span{display:inline-flex;align-items:center;gap:4px}.legend img{width:28px;height:28px;background:none}</style></head><body><header><h1>ウラメク / 調査資料サムネイル一覧（MVP-036）</h1><p>30 枚を事件ごとに並べ、<code>DocumentLabel</code> 相当のテキストラベル（事件 ID・資料番号・資料 ID・種別・コスト）を付けて目視レビューするための静的ページ。画像は <code>public/assets/cases/&lt;case&gt;/documents/&lt;id&gt;.png</code> を参照するだけで編集していない。種別アイコンは <code>public/assets/props/&lt;visual&gt;.svg</code>。</p><nav><a href="./index.html">素材一覧</a><a href="../docs/reviews/document-thumbnails-review.md">レビュー結果</a><a href="../scripts/review_document_thumbnails.py">計測スクリプト</a></nav></header><main><div class="controls"><label><input type="checkbox" id="toggle-labels" checked> ラベルを表示（外すと画像だけで識別できるか確認できる）</label><label><input type="checkbox" id="toggle-small"> ゲーム内サイズ（65×78px）で表示</label></div><section><h2>種別アイコン凡例<small>props/*.svg</small></h2><div class="legend" id="legend"></div></section><div id="root"></div></main><script>
const cases=[{"id":"case-01","title":"消えた55人の利用者","documents":[{"id":"ad","title":"キャンペーン広告","visual":"advert","cost":0},{"id":"trial","title":"無料体験者の登録台帳","visual":"ledger","cost":1},{"id":"paid","title":"料金決済の集計","visual":"receipt","cost":1},{"id":"retained","title":"翌月の継続状況","visual":"report","cost":1},{"id":"memo","title":"広告担当者のメモ","visual":"clipping","cost":1},{"id":"reviews","title":"利用者の声","visual":"news","cost":1}]},{"id":"case-02","title":"半額セールの値札","documents":[{"id":"poster","title":"店舗のポスター","visual":"advert","cost":0},{"id":"launch","title":"発売時の価格台帳","visual":"ledger","cost":1},{"id":"history","title":"30日間の価格履歴","visual":"report","cost":1},{"id":"stock","title":"在庫と販売記録","visual":"receipt","cost":1},{"id":"interview","title":"広告担当の取材記録","visual":"clipping","cost":1},{"id":"competitor","title":"競合店の価格","visual":"news","cost":1}]},{"id":"case-03","title":"8割が支持の正体","documents":[{"id":"headline","title":"速報記事","visual":"news","cost":0},{"id":"count","title":"オンライン投票の集計表","visual":"report","cost":1},{"id":"invite","title":"アンケートの募集方法","visual":"clipping","cost":1},{"id":"population","title":"利用者全体の資料","visual":"ledger","cost":1},{"id":"other","title":"別の調査会社の発表","visual":"report","cost":1},{"id":"comments","title":"SNSの反応","visual":"news","cost":1}]},{"id":"case-04","title":"取り戻せない開発費","documents":[{"id":"minutes","title":"会議議事録","visual":"news","cost":0},{"id":"spent","title":"支払い明細","visual":"receipt","cost":1},{"id":"finish","title":"継続案の見積り","visual":"report","cost":1},{"id":"switch","title":"代替案の見積り","visual":"report","cost":1},{"id":"risk","title":"品質監査メモ","visual":"clipping","cost":1},{"id":"team","title":"メンバーの声","visual":"news","cost":1}]},{"id":"case-05","title":"急上昇するグラフ","documents":[{"id":"graphic","title":"広告の折れ線グラフ","visual":"advert","cost":0},{"id":"raw","title":"元データ","visual":"ledger","cost":1},{"id":"axis","title":"グラフの制作指示","visual":"report","cost":1},{"id":"questions","title":"設問・対象者の記録","visual":"clipping","cost":1},{"id":"press","title":"広報部のコメント","visual":"news","cost":1},{"id":"rumor","title":"SNSのまとめ","visual":"news","cost":1}]}];
const KIND={advert:'広告',ledger:'台帳',receipt:'決済記録',report:'報告書',clipping:'切り抜き',news:'記事',photo:'写真',ticket:'伝票',label:'ラベル'};
const legend=document.querySelector('#legend');for(const [k,v] of Object.entries(KIND)){const s=document.createElement('span');const i=new Image();i.src=`../public/assets/props/${k}.svg`;i.alt='';s.append(i,`${k} = ${v}`);legend.append(s)}
const root=document.querySelector('#root');
for(const c of cases){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=`${c.id.toUpperCase()} ${c.title}`;const small=document.createElement('small');small.textContent=`${c.documents.length} 枚`;h.append(small);section.append(h);const grid=document.createElement('div');grid.className='grid';
c.documents.forEach((d,i)=>{const tile=document.createElement('div');tile.className='tile';const img=new Image();img.className='thumb';img.src=`../public/assets/cases/${c.id}/documents/${d.id}.png`;img.loading='lazy';img.alt=`${c.id}/${d.id}`;
const strong=document.createElement('strong');strong.textContent=d.title;
const lab=document.createElement('span');lab.className='doclabel';const icon=new Image();icon.src=`../public/assets/props/${d.visual}.svg`;icon.alt='';icon.setAttribute('aria-hidden','true');
const mk=(cls,text)=>{const e=document.createElement('span');e.className=cls;e.textContent=text;return e};const sep=()=>{const e=mk('sep','/');e.setAttribute('aria-hidden','true');return e};
lab.append(icon,mk('case',`CASE ${c.id.replace('case-','').padStart(2,'0')}`),sep(),mk('num',`資料 ${String(i+1).padStart(2,'0')}（${d.id}）`),sep(),mk('kind',KIND[d.visual]??d.visual),sep(),mk('cost',d.cost===0?'無料':`コスト ${d.cost}`));
const l=document.createElement('label');l.textContent=`cases/${c.id}/documents/${d.id}.png · visual=${d.visual}`;tile.append(img,strong,lab,l);grid.append(tile)});section.append(grid);root.append(section)}
document.querySelector('#toggle-labels').addEventListener('change',e=>document.body.classList.toggle('hide-labels',!e.target.checked));
document.querySelector('#toggle-small').addEventListener('change',e=>document.body.classList.toggle('small',e.target.checked));
</script></body></html>
