name: CI

on:
  pull_request:
    # edited: PR の題名・本文を直したときもメールアドレス検査を再実行する
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit and PR email privacy
        env:
          # PR: base..head の全コミット。main への push: 直前の状態からの差分（初回 push は HEAD のみ）。
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || format('{0}^!', github.sha)) }}
          # 題名・本文は env 経由で渡す（スクリプトインジェクション対策）。
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-email-privacy.sh "$COMMIT_RANGE"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate content, alternative budget paths and walkthrough
        run: |
          npm run validate:cases
          npm run lint:content
          npm run lint:wording
          npm run lint:ui
          npm run analyze:dead-ends -- --check
          npm run walkthrough -- --check

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Validate assets
        id: validate_assets
        continue-on-error: true
        run: python3 scripts/validate_assets.py

      - name: Upload asset validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-validation
          path: qa/validation.json
          if-no-files-found: warn

      - name: Report asset validation result
        if: always()
        run: |
          echo "validate_assets outcome: ${{ steps.validate_assets.outcome }}"
          if [ -f qa/validation.json ]; then
            {
              echo '### Asset validation'
              echo
              echo '```json'
              cat qa/validation.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.validate_assets.outcome }}" != "success" ]; then
            echo "::warning::scripts/validate_assets.py did not pass. See the asset-validation artifact (qa/validation.json)."
          fi

  e2e:
    name: E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
