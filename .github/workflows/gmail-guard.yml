name: Gmail guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  gmail-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit and PR metadata
        env:
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'origin/main..HEAD' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-no-gmail.sh "$COMMIT_RANGE"
